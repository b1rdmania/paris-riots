function field(mt, goals) {
  // Multi-source movement-cost distance from goal tiles, ignoring units.
  const d = new Array(MW * MH).fill(Infinity), q = [];
  for (const [x, y] of goals) { d[key(x, y)] = 0; q.push([0, x, y]); }
  while (q.length) {
    q.sort((a, b) => a[0] - b[0]);
    const [c, x, y] = q.shift();
    if (c > d[key(x, y)]) continue;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy; if (!inb(nx, ny)) continue;
      const k = cost(mt, x, y) || 99; // cost of leaving toward goal uses this tile
      const nc = c + k;
      if (nc < d[key(nx, ny)] && cost(mt, nx, ny)) { d[key(nx, ny)] = nc; q.push([nc, nx, ny]); }
    }
  }
  return d;
}
