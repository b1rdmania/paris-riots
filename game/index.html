  text(clock, 16 + tw(sd.name) + 10 + tw(`€${G.funds[s]}`) + 12, 5, 13);
  const lm = `LANDMARKS ${marksHeld(0)}/${LANDMARKS} - CURFEW 23:00`;
  text(lm, W - tw(lm) - 5, 5, marksHeld(0) >= NEED ? 30 : 6);
}
function drawBottom() {
  fill(0, BOT, W, H - BOT, 1); fill(0, BOT, W, 1, 0);
  G.buttons = [];
  let info = "";
  if (G.msgT > 0) { G.msgT--; info = G.msg; }
  else {
    const { x, y } = G.cur, u = unitAt(x, y), p = propAt(x, y);
    const d = defAt(x, y);
    const tn = p ? p.name : TNAME[terr(x, y)];
    info = `${tn} ${"*".repeat(d)}`;
    if (p && p.cap < 20) info += ` CAP ${p.cap}`;
    if (u) info = `${U[u.type].name} ${hpD(u)}/10 - ${info}`;
    if (G.mode === "target" && G.sel) { const t = G.targets[G.tsel]; if (t) info = `HIT ${U[t.type].name} FOR ~${calcDmg(G.sel, t, t.x, t.y, 4)}%`; }
  }
  text(info, 5, BOT + 5, G.msgT > 0 ? 26 : 7);
  if (human() && !G.busy && !G.over) {
    const btn = (label, fn, x) => { const w = tw(label) + 8; fill(x - w, BOT + 2, w, 12, 3); text(label, x - w + 4, BOT + 5, 13); G.buttons.push({ x: x - w, y: BOT + 2, w, h: 12, fn }); return x - w - 4; };
    let x = W - 3;
    if (G.mode === "idle" && !G.menu) x = btn("END TURN", () => { SFX.ok(); endTurn(); }, x);
    if (G.mode !== "idle" || G.menu) btn("BACK", () => act("back"), x);
  }
}
function drawMenu() {
  const m = G.menu;
  const w = m.wide ? 190 : 96, lh = 12, h = 16 + m.items.length * lh + (m.wide ? 14 : 0);
  const at = m.at;
  let x = at ? at.x * TS + 22 : G.cur.x * TS + 22, y = at ? TOP + at.y * TS - 6 : TOP + G.cur.y * TS - 6;
  if (m.wide) { x = (W - w) / 2; y = TOP + 30; }
  if (x + w > W - 4) x = (at ? at.x : G.cur.x) * TS - w - 6;
  y = Math.max(TOP + 2, Math.min(BOT - h - 2, y));
  box(x, y, w, h);
  text(m.title, x + 5, y + 4, 29);
  G.menuRects = [];
  m.items.forEach((it, i) => {
    const iy = y + 14 + i * lh;
    G.menuRects.push([x, iy - 2, w, lh]);
    if (i === m.sel) { fill(x + 2, iy - 2, w - 4, lh, 3); text(">", x + 4, iy, 26); }
    text(it.label, x + 12, iy, it.off ? 4 : i === m.sel ? 7 : 6);
    if (it.right) text(it.right, x + w - tw(it.right) - 5, iy, it.off ? 4 : 26);
  });
  if (m.wide) { const b = m.items[m.sel].blurb; if (b) text(b, x + 5, y + h - 11, 21); }
}
function drawBanner() {
  const b = G.banner;
  b.t--;
  if (window.__fast) b.t = 0;
  const k = b.t > 100 ? (110 - b.t) / 10 : b.t < 10 ? b.t / 10 : 1;
  const h = 46, y = Math.round(H / 2 - h / 2);
  fill(0, y, W * k, h, 0); fill(0, y, W * k, 2, b.col); fill(0, y + h - 2, W * k, 2, b.col);
  if (k === 1) {
    textC(b.title, W / 2, y + 9, 7, 2, 2);
    const lines = wrap(b.sub, 60);
    lines.forEach((l, i) => textC(l, W / 2, y + 28 + i * 9, 26));
  }
  if (b.t <= 0) G.banner = null;
}
function drawOver() {
  const o = G.over;
  fill(0, 0, W, H, 0); ctx.globalAlpha = 0.25; ctx.drawImage(mapLayer, 0, TOP); ctx.globalAlpha = 1;
  const s = SIDES[o.winner];
  box(24, 50, W - 48, 130, s.col);
  textC(o.winner === 0 ? "THE STREETS WIN" : "ORDER RESTORED", W / 2, 66, s.col, 0, 2);
  textC(`${s.name} WIN`, W / 2, 90, 7);
  wrap(o.why, 50).forEach((l, i) => textC(l, W / 2, 108 + i * 10, 13));
  textC(`SAT ${hour()}:00  -  LANDMARKS HELD BY LYCEENS ${marksHeld(0)}/${LANDMARKS}`, W / 2, 148, 6);
  if ((frame >> 5) % 2) textC("PRESS SPACE", W / 2, 164, 26);
}

// ---------- title & help ----------
let TITLE_RECTS = [];
const titleBg = (() => { const s = { x: 0 }; return s; })();
function drawTitle() {
  if (!mapLayer) { G = { props: PROPS0.map((p) => ({ ...p })) }; buildMapLayer(); G = null; }
  ctx.drawImage(mapLayer, 0, TOP);
  ctx.globalAlpha = 0.72; fill(0, 0, W, H, 0); ctx.globalAlpha = 1;
  // a few title-screen fires
  for (const [x, y] of [[3, 5], [10, 1], [17, 7], [21, 3], [8, 11]]) {
    const fl = (frame >> 3) % 3;
    fill(x * TS + 4, TOP + y * TS + 6 - fl, 6, 6 + fl, 28); fill(x * TS + 5, TOP + y * TS + 8, 4, 4, 29); fill(x * TS + 6, TOP + y * TS + 10, 2, 2, 26);
  }
  textC("COMMAND &", W / 2, 22, 26, 0, 2);
  textC("COUVRE-FEU", W / 2, 42, 30, 0, 3);
  textC("PARIS - SATURDAY 17 OCTOBER 2026 - CURFEW 23:00", W / 2, 72, 13);
  ctx.drawImage(SPR.lyceen10, 120, 84); ctx.drawImage(SPR.kangoo10, 138, 84); ctx.drawImage(SPR.bloc10, 102, 84);
  ctx.drawImage(SPR.crs00, 248, 84); ctx.drawImage(SPR.canon00, 228, 84); ctx.drawImage(SPR.lacrymo00, 266, 84);
  textC("VS", W / 2 + 4, 89, 7, 0, 1);
  TITLE_RECTS = [];
  TITLE_ITEMS.forEach((it, i) => {
    const y = 116 + i * 16, w = 190, x = (W - w) / 2;
    TITLE_RECTS.push([x, y - 4, w, 15]);
    if (i === titleSel) { box(x, y - 4, w, 15, 26); }
    textC(it.label, W / 2, y, i === titleSel ? 26 : 6);
  });
  textC("ARROWS + SPACE. ESC = BACK. OR JUST CLICK.", W / 2, 186, 4);
  textC("NOBODY DIED. THE LOUVRE SHUT. THE AIR MAX WENT ON VINTED.", W / 2, 222, 5);
}
function drawHelp() {
  fill(0, 0, W, H, 0);
  textC("HOW TO PLAY", W / 2, 10, 26, 0, 2);
  const L = [
    ["", "ADVANCE WARS RULES. ONE SATURDAY IN PARIS, 12:00 TO 23:00."],
    ["", "EACH ROUND IS ONE HOUR. THE LYCEENS MOVE FIRST."],
    [30, "LYCEENS WIN BY HOLDING 4 OF 7 LANDMARKS AT CURFEW,"],
    [30, "OR BY TAKING PLACE BEAUVAU."],
    [24, "CRS WIN IF THEY DON'T, OR BY RETAKING LYCEE VOLTAIRE."],
    ["", ""],
    ["", "SELECT A UNIT, PICK A SQUARE, THEN FIRE, CAPTURE OR WAIT."],
    ["", "FOOT UNITS CAPTURE: 20 POINTS, MINUS THEIR HEALTH EACH TURN."],
    ["", "SHOPS, LANDMARKS AND BASES PAY OUT EVERY TURN."],
    ["", "BUY UNITS ON YOUR METRO STATIONS, BASES AND HQ."],
    ["", "VANS STICK TO ROADS AND PARKS. PEOPLE CLIMB THROUGH BLOCKS."],
    ["", "RANGED UNITS (CADDIE, LACRYMO) CAN'T MOVE AND FIRE."],
    ["", "TEAR GAS HITS EVERYONE NEXT TO THE TARGET. INCLUDING YOURS."],
    ["", "PINK PANTHER CAPTURES ANYTHING IN ONE GO. TONTON IS GASPROOF."],
    ["", "BLOCKS GIVE *** COVER. PARKS **. ROADS NONE."],
    ["", ""],
    ["", "KEYS: ARROWS, SPACE, ESC. E = END TURN. MOUSE OR TAP WORKS TOO."],
  ];
  L.forEach(([c, l], i) => text(l, 14, 34 + i * 10, c === "" ? 6 : c));
  if ((frame >> 5) % 2) textC("PRESS SPACE", W / 2, 222, 26);
}

// ---------- loop ----------
function loop() {
  frame++;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  fill(0, 0, W, H, 0);
  if (screen === "title") drawTitle();
  else if (screen === "help") drawHelp();
  else if (G) {
    if (G.over) drawOver();
    else {
      drawMap();
      if (G.reach) for (const [k] of G.reach.d) { const [x, y] = unkey(k); checker(x, y, 25, frame >> 5); }
      if (G.mode === "target") for (const t of G.targets) checker(t.x, t.y, 30);
      if (G.capturePreview) {}
      drawUnits();
      drawFx();
      if (human() || G.busy) drawCursor();
      drawTop(); drawBottom();
      if (G.menu) drawMenu();
      if (G.banner) drawBanner();
    }
  }
  requestAnimationFrame(loop);
}
// Test hook: lets a headless run inspect and drive the game.
window.__cf = { get G() { return G; }, act, newGame, endTurn, get screen() { return screen; } };
loop();
</script>
