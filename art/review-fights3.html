<!doctype html><meta charset="utf-8"><title>Painted scene combat check</title>
<h1>Painted scene combat check</h1>
<p>Uses the unchanged game and its public attack hook. Each button starts a two-player session and a real adjacent-unit fight. The capture is taken during combat, before damage resolves.</p>
<p><button data-place="METRO REPUBLIQUE">Fight République</button> <button data-place="OPERA">Fight Capucines</button> <button data-place="LOUVRE">Fight Louvre</button> <button data-place="road">Fight Vélib</button> <a id="capture" download="fight-painted.png">Combat PNG</a></p>
<p id="status">Ready after game assets load.</p><iframe id="game" title="Paris Riots live game" src="../game/" width="1152" height="720"></iframe>
<script>
const frame=document.getElementById('game'),status=document.getElementById('status');
for(const b of document.querySelectorAll('button'))b.onclick=async()=>{
 const w=frame.contentWindow;w.__cf.newGame([true,true]);const g=w.__cf.G;g.banner=null;
 let pos=g.props.find(p=>p.name===b.dataset.place);
 if(!pos){outer:for(let y=0;y<w.PARIS.grid.length;y++)for(let x=1;x<23;x++)if(w.PARIS.grid[y][x]==='='&&!g.props.some(p=>p.x===x&&p.y===y)){pos={x,y};break outer}}
 const a={id:100,type:'crs',side:1,x:pos.x,y:pos.y,hp:100,done:false,capturing:false},d={id:101,type:'lyceen',side:0,x:pos.x===23?22:pos.x+1,y:pos.y,hp:100,done:false,capturing:false};g.units=[a,d];g.side=1;g.cur={x:a.x,y:a.y};
 status.textContent='Fighting at '+b.dataset.place+' ('+a.x+','+a.y+'). Both units start at 100 HP.';
 setTimeout(()=>{const link=document.getElementById('capture');link.href=w.document.getElementById('c').toDataURL('image/png');link.dataset.place=b.dataset.place;},1100);
 await w.__cf.attack(a,d);status.textContent='Fight resolved at '+b.dataset.place+': CRS '+a.hp+' HP; Lycéen '+d.hp+' HP.';
};
</script>
