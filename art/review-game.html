<!doctype html><meta charset="utf-8"><title>Klaxxon — live art verification</title>
<h1>Klaxxon art verification</h1>
<p>This loads the unchanged game in an iframe and populates its public __cf test hook. No game source is patched.</p>
<p><button id="first">First five</button> <button id="full">Full roster</button> <button id="native">1×</button> <button id="triple">3×</button> <button id="idle">Idle</button> <button id="walk">Walk</button> <button id="attack">Attack</button> <button id="hit">Hit</button> <button id="ko">Arrest / sit</button> <button id="damage">HP / done</button> <button id="parks">Next park batch</button> <a id="download" download="style-check-2.png">Save game canvas PNG</a></p>
<p id="status">Loading</p>
<iframe id="game" title="Unmodified game" src="../game/" width="1152" height="720"></iframe>
<script>
const game=document.getElementById('game'),status=document.getElementById('status');
const ids=['lyceen','bloc','trott','torse','panther','caddie','kangoo','crs','gm','bravm','lbd','lacrymo','canon'];
let selected=['lyceen','torse','panther','crs','canon'];
function populate(all){const w=game.contentWindow;selected=all?ids:['lyceen','torse','panther','crs','canon'];w.__cf.newGame([true,true]);const g=w.__cf.G;g.banner=null;g.msg='ART CHECK';g.msgT=999999;g.units=[];let n=1;
// Full roster on boulevard y=7, zinc rows y=0 and y=2, with five repeats on parks.
selected.forEach((id,i)=>{const side=ids.indexOf(id)<7?0:1;g.units.push({id:n++,type:id,side,x:2+i,y:7,hp:100,done:false,capturing:false});g.units.push({id:n++,type:id,side,x:i<7?i*2+1:(i-7)*2+1,y:i<7?0:2,hp:100,done:false,capturing:false})});
selected.slice(0,5).forEach((id,i)=>g.units.push({id:n++,type:id,side:ids.indexOf(id)<7?0:1,x:6+i,y:6,hp:100,done:false,capturing:false}));g.cur={x:23,y:12};status.textContent='Roster: '+selected.join(', ')+'. Boulevard row 7; zinc rows 0 / 2; park row 6. Both normal facings.';
}
document.getElementById('first').onclick=()=>populate(false);document.getElementById('full').onclick=()=>populate(true);
document.getElementById('native').onclick=()=>{game.width=384;game.height=240};document.getElementById('triple').onclick=()=>{game.width=1152;game.height=720};
for(const name of ['idle','walk','attack','hit','ko'])document.getElementById(name).onclick=()=>{const w=game.contentWindow;for(const u of w.__cf.G.units)u.pose=name==='idle'?null:{name,t0:w.performance.now()-(name==='attack'?60000:0),dur:100000};status.textContent='Pose: '+name};
document.getElementById('damage').onclick=()=>{for(const u of game.contentWindow.__cf.G.units){u.hp=u.hp===100?60:100;u.done=!u.done}status.textContent='HP and done overlay check'};
let parkBatch=0;document.getElementById('parks').onclick=()=>{const g=game.contentWindow.__cf.G;g.units=g.units.filter(u=>u.y!==6);const batch=ids.slice(parkBatch*4,parkBatch*4+4);batch.forEach((id,i)=>g.units.push({id:100+i,type:id,side:ids.indexOf(id)<7?0:1,x:7+i,y:6,hp:100,done:false,capturing:false}));parkBatch=(parkBatch+1)%4;status.textContent='Park batch: '+batch.join(', ')};
document.getElementById('download').onclick=function(){this.href=game.contentDocument.getElementById('c').toDataURL('image/png')};
game.onload=()=>populate(false);
</script>
